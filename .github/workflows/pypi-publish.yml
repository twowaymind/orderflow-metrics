name: Publish Python to PyPI

# Fires only on tags matching py-v* (e.g. py-v0.1.0), so it never collides with
# the TypeScript release tags (v*). Uses PyPI Trusted Publishing (OIDC) — no API
# token stored in the repo. One-time setup on PyPI (pending publisher):
#   project = orderflow-metrics, owner = twowaymind,
#   repository = orderflow-metrics, workflow = pypi-publish.yml, environment = pypi
on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
